<!doctype html><html><head><style>
body{margin:0;width:2000px;height:1600px;background:linear-gradient(135deg,#0b6e4f,#0d8a63);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
h1{font-size:120px;margin:0;line-height:1.05;text-align:center}
p{font-size:52px;margin:24px 0 60px;opacity:.9}
.sheet{background:#fff;color:#222;border-radius:24px;width:1500px;box-shadow:0 30px 80px rgba(0,0,0,.3);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:38px}th{background:#0b6e4f;color:#fff;padding:18px}td{padding:16px 20px;border-bottom:2px solid #eee;text-align:right}td:first-child{text-align:left;font-weight:600}
tr:nth-child(even) td{background:#f3f3f1}
.tags{display:flex;gap:24px;margin-top:60px}.tags span{background:rgba(255,255,255,.18);padding:16px 32px;border-radius:50px;font-size:40px}
</style></head><body>
<h1>Freelance Business Tracker</h1><p>Income · Expenses · Invoices · Tax set-aside</p>
<div class="sheet"><table><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Profit</th><th>Tax saved</th></tr>
<tr><td>Jan</td><td>$4,800</td><td>$420</td><td>$4,380</td><td>$1,095</td></tr>
<tr><td>Feb</td><td>$5,250</td><td>$310</td><td>$4,940</td><td>$1,235</td></tr>
<tr><td>Mar</td><td>$6,100</td><td>$560</td><td>$5,540</td><td>$1,385</td></tr></table></div>
<div class="tags"><span>Google Sheets</span><span>Excel</span><span>Instant download</span></div>
</body></html>
